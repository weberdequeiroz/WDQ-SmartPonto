<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WDQ SmartPonto</title>
  <meta name="description" content="Controle pessoal de ponto: entrada, intervalos, saída, banco de horas e relatórios.">
  <meta name="theme-color" content="#1e1b4b">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SmartPonto">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="34" height="34">
        <div>
          <div class="brand-name"><span>WDQ</span> SmartPonto</div>
          <div class="brand-sub" id="page-title">Ponto</div>
        </div>
      </div>
      <button class="icon-btn" id="btn-manual" aria-label="Adicionar marcação manual" title="Marcação manual"></button>
    </header>
    <main id="view" tabindex="-1"></main>
    <nav class="tabbar" aria-label="Navegação principal">
      <button data-view="home" aria-label="Ponto"></button>
      <button data-view="history" aria-label="Histórico"></button>
      <button data-view="reminders" aria-label="Lembretes"></button>
      <button data-view="reports" aria-label="Relatórios"></button>
      <button data-view="settings" aria-label="Ajustes"></button>
    </nav>
  </div>
  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="print-root" aria-hidden="true"></div>
  <noscript>Ative o JavaScript para usar o WDQ SmartPonto.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
